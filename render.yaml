services:
  - type: web
    name: monday-data-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: MONDAY_API_TOKEN
        sync: false
      - key: WORK_ORDER_BOARD_ID
        sync: false
      - key: DEAL_FUNNEL_BOARD_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
